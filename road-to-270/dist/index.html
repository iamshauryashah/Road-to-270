<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="A playable presidential campaign strategy game. Create a candidate, compete for delegates, and win 270 electoral votes."><title>Road to 270 — Your campaign starts here</title><link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>★</text></svg>"><style>
:root{--ink:#173c43;--muted:#637a7e;--paper:#f3f6ef;--line:#d8e2da;--teal:#15786e;--blue:#3c79b3;--red:#bc5b51;--gold:#dfb66a}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.55 system-ui,sans-serif}button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:7px;padding:11px 17px;background:var(--teal);color:white;font-weight:650}button:hover{filter:brightness(.94)}button:disabled{opacity:.4;cursor:not-allowed}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:3px}button.secondary{background:#e5eee7;color:var(--ink)}header{padding:19px max(24px,calc((100vw - 1320px)/2));display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);background:#fbfcf8}.brand{font-size:20px;font-weight:850;letter-spacing:-.6px}.brand b{color:var(--teal);margin-right:9px}.tag,.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:2px;font-weight:750}.tag{color:var(--muted)}main{max-width:1320px;margin:auto;padding:32px 24px 50px}h1,h2,h3,p{margin-top:0}h1{font:normal clamp(40px,5vw,65px)/1.08 Georgia,serif;letter-spacing:-2px;margin-bottom:20px}h2{font:normal 30px/1.2 Georgia,serif;letter-spacing:-.6px}h3{font-size:16px;margin-bottom:10px}.muted{color:var(--muted)}.hero{display:grid;grid-template-columns:1.1fr 1fr;gap:60px;align-items:center;margin:12px 0 36px}.hero p{max-width:530px;font-size:16px;color:var(--muted)}.eyebrow{color:var(--teal);margin-bottom:17px}.hero-art{height:230px;border-radius:12px;background:#dfece3;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}.hero-art:before,.hero-art:after{content:'';position:absolute;border:1px solid #b8cec2;border-radius:50%;width:380px;height:380px}.hero-art:after{width:270px;height:270px}.seal{z-index:1;text-align:center;font:65px Georgia;color:var(--teal)}.seal small{display:block;font:11px system-ui;letter-spacing:4px}.steps{display:flex;gap:8px;margin-bottom:28px}.step{flex:1;border-top:3px solid var(--line);padding-top:10px;color:var(--muted);font-size:12px}.step.active{border-color:var(--teal);color:var(--ink);font-weight:750}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card,.panel{background:#fcfdf9;border:1px solid var(--line);border-radius:10px;padding:23px}.choice{display:block;width:100%;color:var(--ink);background:#fcfdf9;text-align:left;font-weight:400;border:1px solid var(--line);padding:23px;border-radius:10px}.choice.selected{border:2px solid var(--teal);padding:22px;background:#eaf2e9}.choice strong{display:block;font-size:17px;margin-bottom:6px}.choice small{display:block;color:var(--muted)}.choice .icon{font-size:28px;display:block;margin-bottom:15px}.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:22px}label{display:block;font-size:12px;font-weight:700;margin-bottom:7px}input:not([type=range]),select{width:100%;border:1px solid #cbd8d1;background:white;color:var(--ink);border-radius:6px;padding:11px}input[type=range]{accent-color:var(--teal);width:100%}.range-ends{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}.footerbar{margin-top:25px;display:flex;justify-content:space-between;align-items:center;gap:20px}.pill{display:inline-block;border-radius:30px;background:#e4eee4;padding:5px 10px;font-size:11px;font-weight:700}.topline{display:flex;align-items:flex-start;justify-content:space-between;gap:20px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:22px 0}.stat{border:1px solid var(--line);background:#fcfdf9;padding:15px 20px;border-radius:8px}.stat small{display:block;color:var(--muted);font-size:10px;letter-spacing:1px;text-transform:uppercase}.stat strong{font-size:27px;font-weight:650}.dashboard{display:grid;grid-template-columns:minmax(0,1.8fr) minmax(300px,1fr);gap:20px}.map{display:grid;grid-template-columns:repeat(12,1fr);gap:5px;max-width:780px;margin:26px auto;min-height:290px}.state{padding:5px 0;font-size:11px;min-width:0;border-radius:5px;background:#e6ede5;color:#4b6569;display:flex;flex-direction:column;justify-content:center;align-items:center;border:2px solid transparent}.state small{font-size:8px;opacity:.85}.state.target{border-color:#c29545}.map-key{display:flex;gap:16px;flex-wrap:wrap;font-size:11px;color:var(--muted)}.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:5px}.row{display:flex;justify-content:space-between;gap:12px;align-items:center;margin:13px 0}.bar{height:6px;background:#e4eae2;border-radius:5px;overflow:hidden}.bar span{display:block;height:100%;background:var(--teal)}.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px}.action{background:#edf3ed;color:var(--ink);text-align:left;font-size:12px;padding:14px}.action small{display:block;color:var(--muted);font-size:10px;font-weight:400;margin-top:4px}.event{border-left:3px solid var(--gold);background:#f7f0df;padding:16px;margin-top:20px}.event p{font-size:13px;margin-bottom:10px}.event button{font-size:11px;margin:3px;padding:8px 10px}.log{max-height:220px;overflow:auto;font-size:12px}.log p{padding:9px 0;border-bottom:1px solid var(--line);margin:0}.detail{background:#edf3ed;padding:16px;border-radius:6px;margin:16px 0;font-size:12px;min-height:78px}.issues{display:grid;grid-template-columns:1fr 1fr;gap:15px}.issue{padding:20px}.issue select{font-size:12px}.issue p{font-size:12px;color:var(--muted);margin:10px 0 0}.bigresult{padding:50px;text-align:center;background:#dfede3;border-radius:12px;margin-bottom:24px}.bigresult h1{font-size:54px}.bigresult p{max-width:650px;margin:0 auto 22px}.countbar{display:flex;height:17px;border-radius:4px;overflow:hidden;margin:15px 0}.fine{font-size:10px;color:var(--muted);margin-top:28px}.wide{width:100%}footer{border-top:1px solid var(--line);padding-top:17px;display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}@media(max-width:800px){.hero{gap:24px}.hero-art{height:190px}.dashboard{grid-template-columns:1fr}.grid{grid-template-columns:1fr 1fr}.map{gap:3px}.state{font-size:9px}.stats{grid-template-columns:1fr 1fr}}@media(max-width:550px){main{padding:22px 15px}.hero{grid-template-columns:1fr}.hero-art{display:none}.tag{display:none}.formgrid,.issues{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.topline{display:block}.panel{padding:15px}.map{min-height:235px}.state small{font-size:7px}.footerbar{align-items:flex-start}.bigresult{padding:30px 15px}.bigresult h1{font-size:38px}}

dialog{border:1px solid var(--line);border-radius:14px;color:var(--ink);background:#fcfdf9;padding:28px;width:min(680px,calc(100vw - 28px));max-height:90vh;overflow:auto;box-shadow:0 30px 100px #173c4333}dialog::backdrop{background:#163c436b;backdrop-filter:blur(4px)}textarea{font:inherit;width:100%;border:1px solid #b9cec4;border-radius:7px;padding:13px;background:white;color:var(--ink);resize:vertical}textarea:focus{outline:2px solid var(--teal)}.judge-status{font-size:11px;padding:10px 12px;background:#f7f0df;border-radius:5px}.response-score{font-size:65px;color:var(--teal);font-weight:750;line-height:1.2;margin-top:14px}.response-score small{font-size:22px;color:var(--muted)}.score-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.score-grid>div{background:#edf3ed;border-radius:6px;padding:10px}.score-grid small{display:block;color:var(--muted);font-size:10px}.issue-impact{font-size:11px;line-height:1.6;margin-top:12px;color:var(--muted)}.issue-impact b{color:var(--teal)}.advantages{margin-top:22px}summary{cursor:pointer;font-weight:700}.advantages .detail{min-height:0}#answerError{color:#a4453e;font-size:12px}
</style></head><body><header><div class="brand"><b>✦</b> ROAD TO 270</div><div class="tag">The presidential campaign game</div><button class="secondary" id="reset">New campaign</button></header><main id="app"></main><script src="game.js"></script></body></html>
